<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario de partidos</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--txt:#16181d;--mut:#6b7280;--line:#e5e7eb;--acc:#0b63c5;--warn:#b45309;--warnbg:#fef3c7}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1e25;--txt:#e9eaee;--mut:#9aa1ad;--line:#2c313b;--acc:#63a4ff;--warn:#fbbf24;--warnbg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 20px}
.sus{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:20px}
.sus code{display:block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px;font-size:.78rem;word-break:break-all}
button,select{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt);cursor:pointer}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tick{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;user-select:none}
.tick input{width:17px;height:17px;accent-color:var(--acc);margin:0;cursor:pointer}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:24px 0 8px}
.p{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.p.sin{border-left-color:var(--warn);background:var(--warnbg)}
.cuando{min-width:88px;font-variant-numeric:tabular-nums}
.dia{font-weight:600}.hora{color:var(--mut);font-size:.9rem}
.quien{flex:1;min-width:200px}
.eq{font-weight:600}.eq em{font-style:normal;color:var(--acc)}
.meta{color:var(--mut);font-size:.82rem;margin-top:2px}
.tag{display:inline-block;background:var(--warn);color:#fff;border-radius:4px;padding:1px 6px;font-size:.7rem;font-weight:700;margin-left:6px}
a.gcal{text-decoration:none;color:var(--acc);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.82rem;white-space:nowrap}
</style>
</head>
<body><main>
<h1 id="titulo">Cargando…</h1>
<p class="sub" id="resumen">Cargando…</p>

<div class="sus">
  <strong>Suscribir en Google Calendar</strong> — Otros calendarios → Añadir por URL.
  El feed lleva <strong>solo los partidos en casa</strong>; para los de fuera, quita el
  filtro de abajo y usa el botón <em>+ Google</em> del partido.
  <code id="feed"></code>
</div>

<div class="filtros">
  <select id="clubsel"></select>
  <label class="tick"><input type="checkbox" id="casa" checked> Solo partidos en casa</label>
  <select id="equipo"><option value="">Todos los equipos</option></select>
  <button id="ocultar">Ocultar pasados</button>
</div>

<div id="lista"></div>
</main>
<script>
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const hoy = new Date().toISOString().slice(0, 10);
let partidos = [], soloFuturos = true, clubes = [], club = null;

const marca = t => new RegExp(club.clave, 'i').test(t) ? `<em>${t}</em>` : t;

function gcal(p) {
  const f = p.fecha.replaceAll('-', '');
  const u = new URLSearchParams({
    action: 'TEMPLATE',
    text: (p.confirmado ? '' : 'POR CONFIRMAR: ') + `${p.local} - ${p.visitante}`,
    details: `${p.competicion} — Jornada ${p.jornada}`,
    location: p.pabellon,
    ctz: 'Europe/Madrid',
  });
  if (p.confirmado) {
    const ini = new Date(`${p.fecha}T${p.hora}`);
    const fin = new Date(ini.getTime() + 2 * 3600e3);
    const sello = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') +
      String(d.getDate()).padStart(2, '0') + 'T' + String(d.getHours()).padStart(2, '0') +
      String(d.getMinutes()).padStart(2, '0') + '00';
    u.set('dates', `${sello(ini)}/${sello(fin)}`);
  } else {
    const d = new Date(p.fecha + 'T12:00');
    d.setDate(d.getDate() + 1);
    u.set('dates', `${f}/${d.toISOString().slice(0, 10).replaceAll('-', '')}`);
  }
  return 'https://calendar.google.com/calendar/render?' + u;
}

function pinta() {
  const eq = document.getElementById('equipo').value;
  const soloCasa = document.getElementById('casa').checked;
  const ver = partidos.filter(p => (!eq || p.competicion === eq) &&
    (!soloFuturos || p.fecha >= hoy) && (!soloCasa || p.casa));
  document.getElementById('resumen').textContent =
    `${ver.length} partidos · ${ver.filter(p => !p.confirmado).length} sin hora confirmada` +
    ` · de ${partidos.length} en total · datos de las federaciones`;
  let html = '', mes = '';
  for (const p of ver) {
    const d = new Date(p.fecha + 'T12:00');
    const m = `${MESES[d.getMonth()]} ${d.getFullYear()}`;
    if (m !== mes) { html += `<h2>${mes = m}</h2>`; }
    html += `<div class="p ${p.confirmado ? '' : 'sin'}">
      <div class="cuando">
        <div class="dia">${DIAS[d.getDay()].slice(0, 3)} ${d.getDate()}</div>
        <div class="hora">${p.confirmado ? p.hora : '--:--'}</div>
      </div>
      <div class="quien">
        <div class="eq">${marca(p.local)} <span style="color:var(--mut)">vs</span> ${marca(p.visitante)}
          ${p.aplazado ? '<span class="tag">APLAZADO</span>' : p.confirmado ? '' : '<span class="tag">POR CONFIRMAR</span>'}</div>
        <div class="meta">${p.competicion} · J${p.jornada}${p.pabellon ? ' · ' + p.pabellon : ''}${p.proviene ? ' · recolocado, venía de la ' + p.proviene : ''}</div>
      </div>
      <a class="gcal" target="_blank" rel="noopener" href="${gcal(p)}">+ Google</a>
    </div>`;
  }
  document.getElementById('lista').innerHTML = html || '<p>No hay partidos.</p>';
}

const selClub = document.getElementById('clubsel');

// Un club = un .json con sus partidos y un .ics con los de casa. El selector y los
// nombres de fichero salen de clubes.json, que escribe fetch.py: anadir un club a
// CLUBES no obliga a tocar esta pagina.
function carga(slug) {
  club = clubes.find(c => c.slug === slug) || clubes[0];
  selClub.value = club.slug;
  document.title = 'Calendario ' + club.nombre;
  document.getElementById('titulo').textContent = club.nombre;
  document.getElementById('feed').textContent = new URL(club.ics, location.href).href;
  // Cada club tiene su URL para poder guardarla en marcadores. En file:// no vale.
  if (location.protocol !== 'file:') history.replaceState(null, '', '?club=' + club.slug);
  fetch(club.json).then(r => r.json()).then(d => {
    partidos = d;
    document.getElementById('equipo').innerHTML = '<option value="">Todos los equipos</option>' +
      [...new Set(d.map(p => p.competicion))].map(c => `<option>${c}</option>`).join('');
    pinta();
  });
}

fetch('clubes.json').then(r => r.json()).then(d => {
  clubes = d;
  selClub.innerHTML = d.map(c => `<option value="${c.slug}">${c.nombre}</option>`).join('');
  carga(new URLSearchParams(location.search).get('club'));
});

selClub.onchange = () => carga(selClub.value);
document.getElementById('equipo').onchange = pinta;
document.getElementById('casa').onchange = pinta;
document.getElementById('ocultar').onclick = e => {
  soloFuturos = !soloFuturos;
  e.target.textContent = soloFuturos ? 'Ocultar pasados' : 'Mostrar todos';
  pinta();
};
</script>
</body></html>
